# ============================================================
# Child in extreme heat
# ============================================================

- id: VG-001
  category: vulnerable_groups
  severity: high
  priority: 90

  description: >
    Young children may be more vulnerable to extreme heat during
    outdoor activity.

  intent_keywords:
    - child
    - children
    - kid
    - kids
    - toddler
    - baby

  user_conditions:
    vulnerable_group: child

  weather_conditions:
    temperature_2m:
      operator: ">="
      value: 38

  guidance: >
    Avoid prolonged outdoor activity for children in extreme heat
    and consider moving the activity to a cooler time.


# ============================================================
# Elderly person in extreme heat
# ============================================================

- id: VG-002
  category: vulnerable_groups
  severity: high
  priority: 90

  description: >
    Elderly individuals may face increased health risks
    during extreme heat conditions.

  intent_keywords:
    - elderly
    - senior
    - older adult
    - grandfather
    - grandmother
    - outside
    - outdoor
    - walking
    - walk

  user_conditions:
    vulnerable_group: elderly

  weather_conditions:
    temperature_2m:
      operator: ">="
      value: 38

  guidance: >
    Avoid prolonged outdoor exposure during extreme heat.
    If going outside is necessary, choose cooler hours,
    stay hydrated, and take frequent breaks.


# Elderly person - normal outdoor conditions

- id: VG-005
  category: vulnerable_groups
  severity: low
  priority: 10

  description: >
    Outdoor conditions are generally suitable for elderly individuals
    when no higher-priority weather safety policy applies.

  intent_keywords:
    - elderly
    - senior
    - older adult
    - grandfather
    - grandmother
    - outside
    - outdoor
    - walking
    - walk

  user_conditions:
    vulnerable_group: elderly

  weather_conditions:
    temperature_2m:
      operator: "<"
      value: 38

  guidance: >
    Conditions appear generally suitable for going outside. Take normal
    precautions, stay hydrated, avoid prolonged exposure during the
    hottest part of the day, and remain aware of changing weather
    conditions.


# ============================================================
# Pet in extreme heat
# ============================================================

- id: VG-003
  category: vulnerable_groups
  severity: medium
  priority: 70

  description: >
    Pets can be vulnerable to prolonged outdoor exposure in very
    hot weather.

  intent_keywords:
    - pet
    - dog
    - puppy
    - cat
    - walk my dog

  user_conditions:
    vulnerable_group: pet

  weather_conditions:
    temperature_2m:
      operator: ">="
      value: 35

  guidance: >
    Avoid prolonged outdoor activity for pets in very hot conditions
    and choose a cooler time for walks or exercise.


# ============================================================
# Vulnerable group in heavy rain
# ============================================================

- id: VG-004
  category: vulnerable_groups
  severity: high
  priority: 95

  description: >
    Heavy rainfall can create additional safety and mobility risks
    for vulnerable individuals outdoors.

  intent_keywords:
    - child
    - children
    - elderly
    - senior
    - older adult
    - pet
    - dog
    - baby
    - grandmother
    - grandfather

  user_conditions:
    vulnerable_group:
      - child
      - elderly
      - pet

  weather_conditions:
    precipitation:
      operator: ">="
      value: 5

  guidance: >
    Avoid unnecessary outdoor activity for vulnerable individuals
    during heavy rainfall because mobility and environmental risks
    may be increased.